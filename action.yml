name: attckus
description: Break your AI agents under attack and failure (attckus test), and scan what they can reach in AWS and Kubernetes, with HTML reports and code-scanning results.
branding:
  icon: shield
  color: red
inputs:
  suite:
    description: attckus test suite file. When set, the job fails if any scenario fails.
    default: ""
  path:
    description: Directory to scan (repo root by default). Put kubectl and IAM JSON exports here to resolve identities.
    default: "."
  fail-on:
    description: Fail the job at this severity or above (critical, high, medium, low, none).
    default: critical
  upload-sarif:
    description: Upload results to GitHub code scanning (needs security-events write permission).
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with: {go-version: "1.24"}
    - name: Build attckus
      shell: bash
      run: go build -o "$RUNNER_TEMP/attckus" "$GITHUB_ACTION_PATH/cmd/attckus"
      working-directory: ${{ github.action_path }}
    - name: Test
      id: test
      if: inputs.suite != ''
      shell: bash
      run: |
        set +e
        "$RUNNER_TEMP/attckus" test --suite "${{ inputs.suite }}" --format junit --out "$RUNNER_TEMP/attckus-runs" \
          --html "$RUNNER_TEMP/attckus-report.html" > "$RUNNER_TEMP/attckus-junit.xml" 2> "$RUNNER_TEMP/attckus-progress.txt"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        { echo '### attckus test'; echo '```'; cat "$RUNNER_TEMP/attckus-progress.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload test evidence
      if: inputs.suite != '' && always()
      uses: actions/upload-artifact@v4
      with:
        name: attckus-test-evidence
        path: |
          ${{ runner.temp }}/attckus-junit.xml
          ${{ runner.temp }}/attckus-report.html
          ${{ runner.temp }}/attckus-runs
    - name: Scan
      id: scan
      shell: bash
      run: |
        set +e
        "$RUNNER_TEMP/attckus" scan --format sarif --fail-on "${{ inputs.fail-on }}" "${{ inputs.path }}" > "$RUNNER_TEMP/attckus.sarif"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        "$RUNNER_TEMP/attckus" scan --fail-on none "${{ inputs.path }}" >> "$GITHUB_STEP_SUMMARY" || true
        "$RUNNER_TEMP/attckus" graph "${{ inputs.path }}" > "$RUNNER_TEMP/attckus-reach.html" || true
    - name: Upload reach report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: attckus-reach-report
        path: ${{ runner.temp }}/attckus-reach.html
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/attckus.sarif
        category: attckus
    - name: Enforce results
      shell: bash
      run: |
        [ "${{ steps.test.outputs.exit || 0 }}" = "0" ] || { echo "attckus test failed"; exit 1; }
        exit ${{ steps.scan.outputs.exit }}
