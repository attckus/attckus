# GitHub Pages site for Attckus. Publish with: Settings → Pages →
# "Deploy from a branch" → branch main, folder /docs.
title: Attckus
description: Break your AI agents before attackers and outages do, and see what they could damage.
url: https://attckus.github.io
baseurl: /attckus

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

mermaid:
  version: "10.9.1"

aux_links:
  "Attckus on GitHub": https://github.com/attckus/attckus
aux_links_new_tab: true

footer_content: "Attckus is open source. Apache-2.0 (intended)."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/attckus/attckus
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

exclude:
  - Gemfile
  - Gemfile.lock
